version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      dev-dependencies:
        dependency-type: "development"
    ignore:
      # tsup needs the TypeScript compiler API, which TypeScript 7 does not provide yet.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
